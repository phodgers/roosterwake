name: firmware build

on:
  push:
    paths:
      - 'firmware/**'
      - '.github/workflows/firmware-build.yml'
  pull_request:
    paths:
      - 'firmware/**'
      - '.github/workflows/firmware-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    # Both supported boards, every push. They differ in chip, flash size, where the config
    # sectors land and whether there is a hardware TRNG, so "it builds" for one says nothing
    # about the other - and the config-sector address is derived from flash size, which is
    # exactly the kind of thing that breaks silently on the board nobody is testing.
    strategy:
      fail-fast: false
      matrix:
        board: [pico2_w, pico_w]

    env:
      PICO_SDK_PATH: ${{ github.workspace }}/pico-sdk
      # The image must stay below the config sectors, which occupy the top 8 KB of flash on
      # whichever board is being built. That is enforced by a linker assertion generated per
      # board (firmware/src/config/flash_reserve.ld.in), so a build that grows into them fails
      # here rather than in a customer's hands.
      PICO_SDK_VERSION: '2.2.0'

    steps:
      - uses: actions/checkout@v4

      - name: Install cmake and ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build
          cmake --version
          ninja --version

      - name: Install the ARM toolchain
        # The official ARM GNU toolchain, not Ubuntu's gcc-arm-none-eabi, and pinned to the
        # exact release used for local development so the binary CI publishes is the binary
        # that was debugged on real hardware.
        #
        # Ubuntu's package was the original choice and it cannot work here: the SDK's
        # pico_cxx_options library compiles new_delete.cpp into every executable, so a C++
        # compiler is mandatory even though this firmware is entirely C — and noble ships no
        # g++-arm-none-eabi at all. The ARM release bundles C, C++ and newlib together, which
        # is precisely why the local build never saw this.
        #
        # The checksum is ARM's published .sha256asc. It is verified rather than trusted
        # because this is the one step that puts a 150 MB third-party binary on the path of a
        # build whose output gets flashed onto other people's hardware.
        env:
          ARM_RELEASE: 14.2.rel1
          ARM_SHA256: 62a63b981fe391a9cbad7ef51b17e49aeaa3e7b0d029b36ca1e9c3b2a9b78823
        run: |
          set -euo pipefail
          tarball="arm-gnu-toolchain-${ARM_RELEASE}-x86_64-arm-none-eabi.tar.xz"
          curl -fsSL --retry 3 --retry-delay 5 -o "$tarball" \
            "https://developer.arm.com/-/media/Files/downloads/gnu/${ARM_RELEASE}/binrel/${tarball}"
          echo "${ARM_SHA256}  ${tarball}" | sha256sum -c -
          sudo mkdir -p /opt/arm-none-eabi
          sudo tar -xf "$tarball" -C /opt/arm-none-eabi --strip-components=1
          rm -f "$tarball"
          echo "/opt/arm-none-eabi/bin" >> "$GITHUB_PATH"

      - name: Report the toolchain versions
        run: |
          arm-none-eabi-gcc --version
          arm-none-eabi-g++ --version

      - name: Check out the pico-sdk
        uses: actions/checkout@v4
        with:
          repository: raspberrypi/pico-sdk
          ref: ${{ env.PICO_SDK_VERSION }}
          path: pico-sdk
          # lib/lwip and lib/cyw43-driver are what make a wireless build possible at all; the
          # SDK's CMake degrades to a warning without them and the wireless targets simply do
          # not exist, which surfaces much later as a confusing link error.
          submodules: recursive

      - name: Configure
        run: >
          cmake -S firmware -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DPICO_BOARD=${{ matrix.board }}

      - name: Build
        run: cmake --build build

      - name: Report the image size
        run: |
          set -euo pipefail
          arm-none-eabi-size build/remotewake.elf
          ls -l build/remotewake.uf2 build/remotewake.bin
          # The config sectors sit in the top 8 KB of flash, so the budget follows the board.
          case "${{ matrix.board }}" in
            pico2_w) flash=$((4 * 1024 * 1024)) ;;
            pico_w)  flash=$((2 * 1024 * 1024)) ;;
          esac
          budget=$((flash - 2 * 4096))
          used=$(stat -c%s build/remotewake.bin)
          echo "flash used: ${used} bytes of ${budget} available (${{ matrix.board }})"
          if [ "$used" -gt "$budget" ]; then
            echo "::error::image overlaps the configuration sectors"; exit 1
          fi

      - name: Upload the UF2
        uses: actions/upload-artifact@v4
        with:
          name: remotewake-uf2-${{ matrix.board }}
          path: |
            build/remotewake.uf2
            build/remotewake.elf
          if-no-files-found: error
