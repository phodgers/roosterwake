name: firmware build

on:
  push:
    paths:
      - 'firmware/**'
      - '.github/workflows/firmware-build.yml'
  pull_request:
    paths:
      - 'firmware/**'
      - '.github/workflows/firmware-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    # Both supported boards, every push. They differ in chip, flash size, where the config
    # sectors land and whether there is a hardware TRNG, so "it builds" for one says nothing
    # about the other - and the config-sector address is derived from flash size, which is
    # exactly the kind of thing that breaks silently on the board nobody is testing.
    strategy:
      fail-fast: false
      matrix:
        board: [pico2_w, pico_w]

    env:
      PICO_SDK_PATH: ${{ github.workspace }}/pico-sdk
      # The image must stay below the config sectors, which occupy the top 8 KB of flash on
      # whichever board is being built. That is enforced by a linker assertion generated per
      # board (firmware/src/config/flash_reserve.ld.in), so a build that grows into them fails
      # here rather than in a customer's hands.
      PICO_SDK_VERSION: '2.2.0'

    steps:
      - uses: actions/checkout@v4

      - name: Install cmake and ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build
          cmake --version
          ninja --version

      - name: Install the ARM toolchain
        # The official ARM GNU toolchain, not Ubuntu's gcc-arm-none-eabi, and pinned to the
        # exact release used for local development so the binary CI publishes is the binary
        # that was debugged on real hardware.
        #
        # Ubuntu's package was the original choice and it cannot work here: the SDK's
        # pico_cxx_options library compiles new_delete.cpp into every executable, so a C++
        # compiler is mandatory even though this firmware is entirely C — and noble ships no
        # g++-arm-none-eabi at all. The ARM release bundles C, C++ and newlib together, which
        # is precisely why the local build never saw this.
        #
        # The checksum is ARM's published .sha256asc. It is verified rather than trusted
        # because this is the one step that puts a 150 MB third-party binary on the path of a
        # build whose output gets flashed onto other people's hardware.
        env:
          ARM_RELEASE: 14.2.rel1
          ARM_SHA256: 62a63b981fe391a9cbad7ef51b17e49aeaa3e7b0d029b36ca1e9c3b2a9b78823
        run: |
          set -euo pipefail
          tarball="arm-gnu-toolchain-${ARM_RELEASE}-x86_64-arm-none-eabi.tar.xz"
          curl -fsSL --retry 3 --retry-delay 5 -o "$tarball" \
            "https://developer.arm.com/-/media/Files/downloads/gnu/${ARM_RELEASE}/binrel/${tarball}"
          echo "${ARM_SHA256}  ${tarball}" | sha256sum -c -
          sudo mkdir -p /opt/arm-none-eabi
          sudo tar -xf "$tarball" -C /opt/arm-none-eabi --strip-components=1
          rm -f "$tarball"
          echo "/opt/arm-none-eabi/bin" >> "$GITHUB_PATH"

      - name: Install picotool
        # The official prebuilt, not the source build the SDK falls back to.
        #
        # `pico_init_picotool()` clones picotool at the SDK's own version tag and builds it. That
        # tag is older than the tooling everything here was developed and proven against: plain
        # 2.2.0 has no `--platform`, which the slot-linked builds need because picotool otherwise
        # infers the chip from metadata it looks for at the start of flash and finds nothing there.
        # A release built by a different picotool from the one that produced the images tested on
        # hardware is not the same release.
        #
        # It is also the step firmware/README.md tells humans to take, and for a second reason: a
        # from-source build with a very new host GCC produces a picotool that segfaults while
        # disassembling the SDK's own boot_stage2.
        env:
          PICOTOOL_RELEASE: v2.2.0-4
          PICOTOOL_BUILD: 2.2.0-a4
          PICOTOOL_SHA256: 163e1b5fd66b8ab27c44a4c5104e0243fc06ea46e2ce0e6614f42d6f144a1afa
        run: |
          set -euo pipefail
          tarball="picotool-${PICOTOOL_BUILD}-x86_64-lin.tar.gz"
          curl -fsSL --retry 3 --retry-delay 5 -o "$tarball" \
            "https://github.com/raspberrypi/pico-sdk-tools/releases/download/${PICOTOOL_RELEASE}/${tarball}"
          echo "${PICOTOOL_SHA256}  ${tarball}" | sha256sum -c -
          # The archive already has a top-level picotool/ holding the binary and the cmake config
          # together, so it extracts into the workspace as it is.
          tar -xf "$tarball" -C "${{ github.workspace }}"
          rm -f "$tarball"
          # The directory holding picotoolConfig.cmake; find_package(picotool) then skips the
          # source build entirely.
          echo "picotool_DIR=${{ github.workspace }}/picotool" >> "$GITHUB_ENV"
          "${{ github.workspace }}/picotool/picotool" version

      - name: Report the toolchain versions
        run: |
          arm-none-eabi-gcc --version
          arm-none-eabi-g++ --version

      - name: Check out the pico-sdk
        uses: actions/checkout@v4
        with:
          repository: raspberrypi/pico-sdk
          ref: ${{ env.PICO_SDK_VERSION }}
          path: pico-sdk
          # lib/lwip and lib/cyw43-driver are what make a wireless build possible at all; the
          # SDK's CMake degrades to a warning without them and the wireless targets simply do
          # not exist, which surfaces much later as a confusing link error.
          submodules: recursive

      # Both slots. They are separate links at different addresses, and a change that fits one and
      # not the other is a release that half exists — so both are built on every push rather than
      # discovered at tag time.
      - name: Configure and build both slots
        run: |
          set -euo pipefail
          for slot in a b; do
            cmake -S firmware -B "build-${slot}" -G Ninja \
              -DCMAKE_BUILD_TYPE=Release -DPICO_BOARD=${{ matrix.board }} -DRW_SLOT="${slot}"
            cmake --build "build-${slot}"
          done

      # The loader is the one component that must always work: it is never replaced over the air,
      # so a device that boots a broken one is recoverable only with a cable. Building it here
      # means a change that breaks it fails on the push that made it.
      - name: Build the loader
        run: |
          set -euo pipefail
          cmake -S firmware/loader -B build-loader -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DPICO_BOARD=${{ matrix.board }}
          cmake --build build-loader

      - name: Report the image sizes
        run: |
          set -euo pipefail
          arm-none-eabi-size build-a/remotewake.elf
          ls -l build-a/remotewake.uf2 build-a/remotewake.bin build-loader/loader.uf2

          # The linker already caps each region — the FLASH region is written per slot, so an
          # image that outgrows its slot fails to link. This reports the headroom, which is the
          # number that tells you how close the next feature is to not fitting.
          slot=$((704 * 1024))
          loader=$((64 * 1024))
          for s in a b; do
            used=$(stat -c%s "build-${s}/remotewake.bin")
            echo "slot ${s}: ${used} bytes of ${slot} (${{ matrix.board }})"
          done
          used=$(stat -c%s build-loader/loader.bin)
          echo "loader: ${used} bytes of ${loader}"

      # Enough to install a device by hand from a branch build: the loader and the slot A image
      # are the two files a fresh install writes. Slot B is not attached — nothing ever flashes it
      # by cable, and offering it invites somebody to try.
      - name: Upload the images
        uses: actions/upload-artifact@v4
        with:
          name: remotewake-uf2-${{ matrix.board }}
          path: |
            build-loader/loader.uf2
            build-a/remotewake.uf2
            build-a/remotewake.elf
          if-no-files-found: error
