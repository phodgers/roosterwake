name: tools-ci

# The mkconfig codec is one of three implementations of the flash config format (the others
# being the firmware's C and the hosted dashboard's generator). This job is what stops them
# drifting: it asserts the encoder still reproduces the committed golden vectors, and that
# regenerating those vectors is a no-op. A change here that is not mirrored in
# firmware/src/config/config.c will fail the firmware's host tests instead.

on:
  push:
    paths: ['tools/**', 'firmware/test/vectors/**', '.github/workflows/tools-ci.yml']
  pull_request:
    paths: ['tools/**', 'firmware/test/vectors/**', '.github/workflows/tools-ci.yml']
  workflow_dispatch:

jobs:
  mkconfig:
    runs-on: ubuntu-latest

    # mkconfig is a published MIT CLI declaring `engines: node >=20`, so 20 is a promise to
    # anyone who installs it — and an untested promise is just a wish. Both ends of the
    # supported range run here: 20 because we claim it, 24 because that is what a user who
    # types `npx @roosterwake/mkconfig` today actually gets.
    #
    # This matrix exists because of a real failure: the test script used to be
    # `node --test "test/*.test.mjs"`, and `node --test` only expands globs from 22 onwards.
    # On 20 the pattern was taken as a literal path, so CI failed with "Could not find" having
    # executed no tests at all, while the same command passed locally on a newer Node.
    #
    # It is now bare `node --test`, which uses Node's own discovery and behaves identically on
    # every supported version. Note that discovery claims *every* .mjs file under a directory
    # named `test`, which is why the vector generator lives in scripts/ — next to the suite it
    # feeds, it would be collected and run as if it were a test.
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20', '24']

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Test the config codec against the golden vectors
        run: npm test
        working-directory: tools/mkconfig

      - name: Golden vectors are reproducible
        # Regenerating must be a no-op. If it is not, someone changed the encoder without
        # regenerating — which means the committed vectors no longer describe the format, and
        # the firmware is being validated against a stale contract.
        run: |
          node scripts/gen-vectors.mjs
          if ! git diff --exit-code --stat ../../firmware/test/vectors/config-v1.json; then
            echo "::error::Golden vectors are stale. Run 'npm run gen-vectors' in tools/mkconfig"
            echo "::error::and mirror the encoder change in firmware/src/config/config.c."
            exit 1
          fi
        working-directory: tools/mkconfig

      - name: CLI smoke test
        # Exercises the real entry point, not just the library: generate an image, read it
        # back, and assert the round-trip survived.
        run: |
          set -e
          node bin/mkconfig.mjs \
            --ssid "CI Network" --psk "ci-password" --auth wpa2 \
            --target "Test PC=AA:BB:CC:DD:EE:FF" \
            --out /tmp/ci-config.uf2
          node bin/mkconfig.mjs --verify /tmp/ci-config.uf2 | tee /tmp/verify.txt
          grep -q "Test PC -> AA:BB:CC:DD:EE:FF" /tmp/verify.txt
          grep -q "0x103FF000" /tmp/verify.txt
          grep -q "RP2350_ARM_S" /tmp/verify.txt
          # The token and password must never be printed back out.
          if grep -qi "ci-password" /tmp/verify.txt; then
            echo "::error::--verify leaked the Wi-Fi password"; exit 1
          fi
        working-directory: tools/mkconfig
