name: firmware release

# Publishes a release: four files per board.
#
# A device runs two programs. The loader owns the first 64 KB of flash and is never replaced over
# the air; the firmware occupies one of two slots behind it and is linked at the address of the
# slot it lives in, so it is built twice. That gives, per board:
#
#   loader.uf2      written once at 0x10000000, by a host
#   -install.uf2    the slot A firmware, written by a host behind the loader
#   -a.rwfw         the signed slot A image, streamed to a device running slot B
#   -b.rwfw         the signed slot B image, streamed to a device running slot A
#
# The UF2s are attached to the GitHub release so nobody needs a toolchain to own this device. All
# four go to the firmware registry, which is what setup.roosterwake.com and the relay read.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and release (must already exist)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    env:
      PICO_SDK_PATH: ${{ github.workspace }}/pico-sdk
      PICO_SDK_VERSION: '2.2.0'
      ARM_RELEASE: 14.2.rel1
      ARM_SHA256: 62a63b981fe391a9cbad7ef51b17e49aeaa3e7b0d029b36ca1e9c3b2a9b78823

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0   # release notes are generated from the log since the previous tag

      - name: Work out the version
        id: ver
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$tag"                 >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}"         >> "$GITHUB_OUTPUT"

      # The firmware reports its version in `hello`, in status_result and in usbcfg INFO. A
      # release whose binary disagrees with its tag is a support conversation nobody can win,
      # so the mismatch is a build failure rather than a note in the release body.
      - name: Check brand.h agrees with the tag
        run: |
          set -euo pipefail
          in_header=$(grep -oP '#define RW_FW_VERSION "\K[^"]+' firmware/src/brand.h)
          want="${{ steps.ver.outputs.version }}"
          if [ "$in_header" != "$want" ]; then
            echo "::error::brand.h says RW_FW_VERSION \"$in_header\" but the tag is \"$want\"."
            echo "::error::Update firmware/src/brand.h and re-tag."
            exit 1
          fi
          echo "version $want confirmed"

      # An unsigned image is one no device will install, so a release built without the key is a
      # release that cannot be deployed. Caught here rather than after twenty minutes of building.
      - name: Check the signing key is present
        env:
          FIRMWARE_SIGNING_KEY: ${{ secrets.FIRMWARE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${FIRMWARE_SIGNING_KEY:-}" ]; then
            echo "::error::FIRMWARE_SIGNING_KEY is not set. Every device checks the signature"
            echo "::error::against a key compiled into it, so unsigned images cannot be installed."
            echo "::error::Set it with: gh secret set FIRMWARE_SIGNING_KEY < ~/.roosterwake/firmware-signing.pem"
            exit 1
          fi
          umask 077
          printf '%s\n' "$FIRMWARE_SIGNING_KEY" > signing-key.pem
          openssl pkey -in signing-key.pem -noout
          echo "signing key loaded"

      - name: Install cmake and ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build

      - name: Install the ARM toolchain
        run: |
          set -euo pipefail
          tarball="arm-gnu-toolchain-${ARM_RELEASE}-x86_64-arm-none-eabi.tar.xz"
          curl -fsSL --retry 3 --retry-delay 5 -o "$tarball" \
            "https://developer.arm.com/-/media/Files/downloads/gnu/${ARM_RELEASE}/binrel/${tarball}"
          echo "${ARM_SHA256}  ${tarball}" | sha256sum -c -
          sudo mkdir -p /opt/arm-none-eabi
          sudo tar -xf "$tarball" -C /opt/arm-none-eabi --strip-components=1
          echo "/opt/arm-none-eabi/bin" >> "$GITHUB_PATH"

      - name: Install picotool
        # The official prebuilt, not the source build the SDK falls back to.
        #
        # `pico_init_picotool()` clones picotool at the SDK's own version tag and builds it. That
        # tag is older than the tooling everything here was developed and proven against: plain
        # 2.2.0 has no `--platform`, which the slot-linked builds need because picotool otherwise
        # infers the chip from metadata it looks for at the start of flash and finds nothing there.
        # A release built by a different picotool from the one that produced the images tested on
        # hardware is not the same release.
        #
        # It is also the step firmware/README.md tells humans to take, and for a second reason: a
        # from-source build with a very new host GCC produces a picotool that segfaults while
        # disassembling the SDK's own boot_stage2.
        env:
          PICOTOOL_RELEASE: v2.2.0-4
          PICOTOOL_BUILD: 2.2.0-a4
          PICOTOOL_SHA256: 163e1b5fd66b8ab27c44a4c5104e0243fc06ea46e2ce0e6614f42d6f144a1afa
        run: |
          set -euo pipefail
          tarball="picotool-${PICOTOOL_BUILD}-x86_64-lin.tar.gz"
          curl -fsSL --retry 3 --retry-delay 5 -o "$tarball" \
            "https://github.com/raspberrypi/pico-sdk-tools/releases/download/${PICOTOOL_RELEASE}/${tarball}"
          echo "${PICOTOOL_SHA256}  ${tarball}" | sha256sum -c -
          # The archive already has a top-level picotool/ holding the binary and the cmake config
          # together, so it extracts into the workspace as it is.
          tar -xf "$tarball" -C "${{ github.workspace }}"
          rm -f "$tarball"
          # The directory holding picotoolConfig.cmake; find_package(picotool) then skips the
          # source build entirely.
          echo "picotool_DIR=${{ github.workspace }}/picotool" >> "$GITHUB_ENV"
          "${{ github.workspace }}/picotool/picotool" version

      - name: Check out the pico-sdk
        uses: actions/checkout@v4
        with:
          repository: raspberrypi/pico-sdk
          ref: ${{ env.PICO_SDK_VERSION }}
          path: pico-sdk
          submodules: recursive

      # Both boards, every release. `firmware_releases` is keyed by board because RP2040 firmware
      # on an RP2350 does not boot, and an image with no board in its name is one somebody
      # eventually flashes to the wrong chip.
      - name: Build the loader and both slots, for both boards
        id: art
        run: |
          set -euo pipefail
          v="${{ steps.ver.outputs.version }}"
          mkdir -p dist

          for board in pico2_w pico_w; do
            cmake -S firmware/loader -B "build-loader-${board}" -G Ninja \
              -DCMAKE_BUILD_TYPE=Release -DPICO_BOARD="${board}"
            cmake --build "build-loader-${board}"
            cp "build-loader-${board}/loader.uf2" "dist/loader-${v}-${board}.uf2"

            for slot in a b; do
              cmake -S firmware -B "build-${board}-${slot}" -G Ninja \
                -DCMAKE_BUILD_TYPE=Release -DPICO_BOARD="${board}" -DRW_SLOT="${slot}"
              cmake --build "build-${board}-${slot}"

              # The signed image wraps the raw flash image, not the UF2: a UF2 is a container for
              # a host to write, and the device is writing to its own flash.
              python3 firmware/tools/sign_image.py \
                "build-${board}-${slot}/roosterwake.bin" \
                "dist/roosterwake-${v}-${board}-${slot}.rwfw" \
                --key signing-key.pem --version "$v" --board "$board"
            done

            # Slot A is what a fresh install writes. Slot B has no UF2 because nothing ever
            # flashes it by cable - it exists to be the destination of the first update.
            cp "build-${board}-a/roosterwake.uf2" "dist/roosterwake-${v}-${board}-install.uf2"
            echo "size_${board}=$(stat -c%s "build-${board}-a/roosterwake.bin")" >> "$GITHUB_OUTPUT"
          done

          cd dist
          sha256sum ./* > "roosterwake-${v}.sha256"
          cat "roosterwake-${v}.sha256"

      - name: Write the release notes
        id: notes
        run: |
          set -euo pipefail
          v="${{ steps.ver.outputs.version }}"
          prev=$(git describe --tags --abbrev=0 "${{ steps.ver.outputs.tag }}^" 2>/dev/null || true)

          {
            echo "## Install"
            echo
            echo "**You do not need a toolchain.** Pick whichever suits you:"
            echo
            echo "1. **Browser** — open <https://setup.roosterwake.com>, plug the dongle in, and"
            echo "   follow the steps. It writes both files for you. Chromium-based browsers only"
            echo "   (Web Serial and WebUSB)."
            echo "2. **Drag and drop** — hold BOOTSEL while plugging the board in, then copy"
            echo "   **\`loader\`** onto the drive that appears. The board restarts, finds no"
            echo "   firmware and comes back as a drive by itself; copy **\`-install\`** onto it."
            echo "3. **Already flashed** — kits ship ready to go; just plug it in."
            echo
            echo "**Copy them one at a time.** A single file spanning both regions loses whichever"
            echo "region's blocks arrive last, in either order, and leaves one of them erased."
            echo
            echo "| Board | Loader | Firmware |"
            echo "|---|---|---|"
            echo "| Pico 2 W (RP2350) — the product | \`loader-${v}-pico2_w.uf2\` | \`roosterwake-${v}-pico2_w-install.uf2\` |"
            echo "| Pico W (RP2040) | \`loader-${v}-pico_w.uf2\` | \`roosterwake-${v}-pico_w-install.uf2\` |"
            echo
            echo "**The two boards are not interchangeable.** RP2040 firmware on an RP2350 does not boot."
            echo
            echo "Configuration in flash survives a firmware update, so a device reflashed this"
            echo "way comes back already provisioned."
            echo
            echo "## Updating over the air"
            echo
            echo "The \`.rwfw\` files are signed firmware images. They are **not** flashed by hand —"
            echo "the relay streams one to a device over its existing connection, and the device"
            echo "checks the signature against a key compiled into the image already running. Each"
            echo "release carries one per slot because firmware executes in place and is linked at"
            echo "the address of the slot it occupies; a device is offered the one built for the"
            echo "slot it is *not* running from."
            echo
            echo "A device that updates gets three boots to reach the relay. If it cannot, the"
            echo "loader returns to the previous image on its own."
            echo
            echo "Verify downloads against \`roosterwake-${v}.sha256\`."
            echo
            echo "Flash used: ${{ steps.art.outputs.size_pico2_w }} bytes on the Pico 2 W of"
            echo "720,896 available per slot; ${{ steps.art.outputs.size_pico_w }} on the Pico W."
            echo
            echo "## Changes"
            echo
            if [ -n "$prev" ]; then
              git log --no-merges --pretty='- %s' "${prev}..${{ steps.ver.outputs.tag }}"
            else
              echo "- First release."
            fi
          } > notes.md
          cat notes.md

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Rooster Wake firmware ${{ steps.ver.outputs.version }}
          body_path: notes.md
          files: dist/*
          fail_on_unmatched_files: true

      # Publishes every artefact to the firmware registry, so nothing downstream has a version
      # number compiled into it. Without this step a release is a file on a web page:
      # setup.roosterwake.com reads `firmware_releases` to know what to install, and the relay
      # reads it to know what to offer.
      #
      # The BYTES are uploaded, not a download URL for the endpoint to fetch. This repository is
      # private until launch, so a release asset URL needs a credential the cloud would have to hold
      # and rotate - and a fetch that happens later can fetch something else. Posting the file means
      # what is published is exactly what was built, and the endpoint computes the digest itself
      # rather than trusting the one in the request.
      #
      # Skipped rather than failed when the secret is absent: a release that cannot publish itself
      # is still a release people can download by hand.
      - name: Publish to the firmware registry
        env:
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${ADMIN_API_KEY:-}" ]; then
            echo "::notice::ADMIN_API_KEY is not set; skipping the firmware-registry callback."
            exit 0
          fi
          v="${{ steps.ver.outputs.version }}"
          for board in pico2_w pico_w; do
            for kind in loader install ota-a ota-b; do
              case "$kind" in
                loader)  file="dist/loader-${v}-${board}.uf2" ;;
                install) file="dist/roosterwake-${v}-${board}-install.uf2" ;;
                ota-a)   file="dist/roosterwake-${v}-${board}-a.rwfw" ;;
                ota-b)   file="dist/roosterwake-${v}-${board}-b.rwfw" ;;
              esac
              sha=$(sha256sum "$file" | cut -d' ' -f1)
              echo "publishing ${board} ${kind} (${sha})"
              # --fail-with-body so a refusal prints the endpoint's explanation rather than just an
              # exit code. A 409 means this version already exists with different contents, which is
              # a real problem and should stop the workflow rather than be logged and ignored.
              curl -sS --fail-with-body -X POST \
                "https://admin.roosterwake.com/api/firmware/releases?version=${v}&board=${board}&kind=${kind}&channel=stable" \
                -H "authorization: Bearer ${ADMIN_API_KEY}" \
                -H 'content-type: application/octet-stream' \
                -H "x-firmware-sha256: ${sha}" \
                --data-binary "@${file}"
              echo
            done
          done

      - name: Shred the signing key
        if: always()
        run: rm -f signing-key.pem
