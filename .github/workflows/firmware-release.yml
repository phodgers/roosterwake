name: firmware release

# Publishes a downloadable UF2.
#
# This workflow is the reason nobody has to install a toolchain to own this device. The three
# ways firmware gets onto a dongle - pre-flashed in a kit, flashed by setup.remotewake.com over
# WebUSB, or dragged onto the BOOTSEL drive - all end up pulling the artefact this job attaches
# to a GitHub release. `firmware build` produces an Actions artefact, which expires after 90
# days and needs a GitHub login; that is fine for CI and useless as a download.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and release (must already exist)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    env:
      PICO_SDK_PATH: ${{ github.workspace }}/pico-sdk
      PICO_SDK_VERSION: '2.2.0'
      ARM_RELEASE: 14.2.rel1
      ARM_SHA256: 62a63b981fe391a9cbad7ef51b17e49aeaa3e7b0d029b36ca1e9c3b2a9b78823

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0   # release notes are generated from the log since the previous tag

      - name: Work out the version
        id: ver
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$tag"                 >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}"         >> "$GITHUB_OUTPUT"

      # The firmware reports its version in `hello`, in status_result and in usbcfg INFO. A
      # release whose binary disagrees with its tag is a support conversation nobody can win,
      # so the mismatch is a build failure rather than a note in the release body.
      - name: Check brand.h agrees with the tag
        run: |
          set -euo pipefail
          in_header=$(grep -oP '#define RW_FW_VERSION "\K[^"]+' firmware/src/brand.h)
          want="${{ steps.ver.outputs.version }}"
          if [ "$in_header" != "$want" ]; then
            echo "::error::brand.h says RW_FW_VERSION \"$in_header\" but the tag is \"$want\"."
            echo "::error::Update firmware/src/brand.h and re-tag."
            exit 1
          fi
          echo "version $want confirmed"

      - name: Install cmake and ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build

      - name: Install the ARM toolchain
        run: |
          set -euo pipefail
          tarball="arm-gnu-toolchain-${ARM_RELEASE}-x86_64-arm-none-eabi.tar.xz"
          curl -fsSL --retry 3 --retry-delay 5 -o "$tarball" \
            "https://developer.arm.com/-/media/Files/downloads/gnu/${ARM_RELEASE}/binrel/${tarball}"
          echo "${ARM_SHA256}  ${tarball}" | sha256sum -c -
          sudo mkdir -p /opt/arm-none-eabi
          sudo tar -xf "$tarball" -C /opt/arm-none-eabi --strip-components=1
          echo "/opt/arm-none-eabi/bin" >> "$GITHUB_PATH"

      - name: Check out the pico-sdk
        uses: actions/checkout@v4
        with:
          repository: raspberrypi/pico-sdk
          ref: ${{ env.PICO_SDK_VERSION }}
          path: pico-sdk
          submodules: recursive

      # Both boards, every release. This used to build one image with no board in its name, which
      # was fine while the only consumer was a human reading the release page and wrong the moment
      # anything automated existed: `firmware_releases.board` is part of that table's uniqueness
      # constraint, and setup.remotewake.com asks for an image by board because RP2040 firmware on
      # an RP2350 does not boot. An unnamed image is one somebody eventually flashes to the wrong
      # chip.
      - name: Build both boards and checksum them
        id: art
        run: |
          set -euo pipefail
          v="${{ steps.ver.outputs.version }}"
          mkdir -p dist
          for board in pico2_w pico_w; do
            cmake -S firmware -B "build-${board}" -G Ninja \
              -DCMAKE_BUILD_TYPE=Release -DPICO_BOARD="${board}"
            cmake --build "build-${board}"
            cp "build-${board}/remotewake.uf2" "dist/remotewake-${v}-${board}.uf2"
            cp "build-${board}/remotewake.elf" "dist/remotewake-${v}-${board}.elf"
            echo "size_${board}=$(stat -c%s "build-${board}/remotewake.bin")" >> "$GITHUB_OUTPUT"
          done
          cd dist
          sha256sum remotewake-${v}-*.uf2 remotewake-${v}-*.elf > "remotewake-${v}.sha256"
          cat "remotewake-${v}.sha256"

      - name: Write the release notes
        id: notes
        run: |
          set -euo pipefail
          v="${{ steps.ver.outputs.version }}"
          prev=$(git describe --tags --abbrev=0 "${{ steps.ver.outputs.tag }}^" 2>/dev/null || true)

          {
            echo "## Install"
            echo
            echo "**You do not need a toolchain.** Pick whichever suits you:"
            echo
            echo "1. **Browser** — open <https://setup.remotewake.com>, plug the dongle in, and"
            echo "   follow the steps. Chromium-based browsers only (Web Serial and WebUSB)."
            echo "2. **Drag and drop** — hold BOOTSEL while plugging the board in, then copy the"
            echo "   image for your board onto the drive that appears. Works everywhere."
            echo "3. **Already flashed** — kits ship ready to go; just plug it in."
            echo
            echo "| Board | Image |"
            echo "|---|---|"
            echo "| Pico 2 W (RP2350) — the product | \`remotewake-${v}-pico2_w.uf2\` |"
            echo "| Pico W (RP2040) | \`remotewake-${v}-pico_w.uf2\` |"
            echo
            echo "**The two are not interchangeable.** RP2040 firmware on an RP2350 does not boot."
            echo
            echo "Configuration in flash survives a firmware update, so a device reflashed this"
            echo "way comes back already provisioned."
            echo
            echo "Verify the download against \`remotewake-${v}.sha256\`."
            echo
            echo "Flash used: ${{ steps.art.outputs.size_pico2_w }} bytes on the Pico 2 W of"
            echo "4,186,112 available; ${{ steps.art.outputs.size_pico_w }} on the Pico W of 2,088,960."
            echo
            echo "## Changes"
            echo
            if [ -n "$prev" ]; then
              git log --no-merges --pretty='- %s' "${prev}..${{ steps.ver.outputs.tag }}"
            else
              echo "- First release."
            fi
          } > notes.md
          cat notes.md

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Remote Wake firmware ${{ steps.ver.outputs.version }}
          body_path: notes.md
          files: dist/*
          fail_on_unmatched_files: true

      # Publishes each image to the firmware registry, so neither the dashboard nor
      # setup.remotewake.com has a version number compiled into it. Without this step a release is
      # a file on a web page: setup.remotewake.com reads `firmware_releases`, so an unpublished
      # build is invisible to it and there is nothing for it to install.
      #
      # The BYTES are uploaded, not a download URL for the endpoint to fetch. This repository is
      # private until launch, so a release asset URL needs a credential the cloud would have to hold
      # and rotate - and a fetch that happens later can fetch something else. Posting the file means
      # what is published is exactly what was built, and the endpoint computes the digest itself
      # rather than trusting the one in the request.
      #
      # Skipped rather than failed when the secret is absent: a release that cannot publish itself
      # is still a release people can download by hand.
      - name: Publish to the firmware registry
        env:
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${ADMIN_API_KEY:-}" ]; then
            echo "::notice::ADMIN_API_KEY is not set; skipping the firmware-registry callback."
            exit 0
          fi
          v="${{ steps.ver.outputs.version }}"
          for board in pico2_w pico_w; do
            file="dist/remotewake-${v}-${board}.uf2"
            sha=$(sha256sum "$file" | cut -d' ' -f1)
            echo "publishing ${board} (${sha})"
            # --fail-with-body so a refusal prints the endpoint's explanation rather than just an
            # exit code. A 409 means this version already exists with different contents, which is
            # a real problem and should stop the workflow rather than be logged and ignored.
            curl -sS --fail-with-body -X POST \
              "https://admin.remotewake.com/api/firmware/releases?version=${v}&board=${board}&channel=stable" \
              -H "authorization: Bearer ${ADMIN_API_KEY}" \
              -H 'content-type: application/octet-stream' \
              -H "x-firmware-sha256: ${sha}" \
              --data-binary "@${file}"
            echo
          done
